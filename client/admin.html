<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - MarbleWS</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body {
            background: #1a1a2e;
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            color: white;
        }

        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
        }

        .admin-header {
            text-align: center;
            margin-bottom: 30px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .admin-header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #4ecdc4;
        }

        .admin-header p {
            color: #ffffff;
            opacity: 0.8;
        }

        .top-section {
            display: flex;
            gap: 30px;
            margin-bottom: 30px;
        }

        .current-level {
            flex: 1;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .current-level h2 {
            color: #4ecdc4;
            margin-bottom: 10px;
            font-size: 1.2em;
        }

        .current-level p {
            font-size: 1.1em;
            color: #ffffff;
        }

        .twitch-config {
            flex: 1;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .twitch-config h2 {
            color: #4ecdc4;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .twitch-config .current-channel {
            margin-bottom: 15px;
            font-size: 0.9em;
            opacity: 0.8;
        }

        .twitch-config .channel-input {
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        .twitch-config input[type="text"] {
            padding: 8px 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 0.9em;
            min-width: 200px;
        }

        .twitch-config input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .twitch-config input[type="text"]:focus {
            outline: none;
            border-color: #4ecdc4;
            box-shadow: 0 0 5px rgba(78, 205, 196, 0.3);
        }

        .levels-container {
            max-height: 70vh;
            overflow-y: auto;
            padding: 10px 0;
        }

        .levels-section {
            margin-bottom: 40px;
        }

        .levels-section h3 {
            color: #4ecdc4;
            font-size: 1.4em;
            margin-bottom: 15px;
            padding-bottom: 5px;
            border-bottom: 2px solid rgba(78, 205, 196, 0.3);
        }

        .levels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .level-card {
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .level-card:hover {
            border-color: #4ecdc4;
            box-shadow: 0 0 10px rgba(78, 205, 196, 0.2);
        }

        .level-preview {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.3;
        }

        .preview-canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .level-content {
            position: relative;
            z-index: 1;
        }

        .level-name {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 10px;
            color: #4ecdc4;
        }

        .level-name .current-indicator {
            color: #ff6b6b;
            font-size: 0.8em;
            font-weight: normal;
        }

        .level-info {
            font-size: 0.9em;
            opacity: 0.7;
            margin-bottom: 15px;
            color: #ffffff;
        }

        .level-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .btn-primary {
            background: #4ecdc4;
            color: white;
        }

        .btn-primary:hover {
            background: #44a08d;
            transform: translateY(-1px);
        }

        .btn-danger {
            background: #ff6b6b;
            color: white;
        }

        .btn-danger:hover {
            background: #e55a5a;
            transform: translateY(-1px);
        }

        .status-message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
            border: 1px solid;
        }

        .status-success {
            background: rgba(78, 205, 196, 0.1);
            color: #4ecdc4;
            border-color: #4ecdc4;
        }

        .status-error {
            background: rgba(255, 107, 107, 0.1);
            color: #ff6b6b;
            border-color: #ff6b6b;
        }

        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-weight: bold;
        }

        .back-link:hover {
            background: rgba(0, 0, 0, 0.9);
            border-color: #4ecdc4;
            transform: translateY(-1px);
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <a href="/" class="back-link">← Back to Game</a>

    <div class="admin-container">
        <div class="admin-header">
            <h1>Admin Panel</h1>
            <p>Manage game levels and server settings</p>
        </div>

        <div class="top-section">
            <div id="currentLevel" class="current-level">
                <h2>Current Level</h2>
                <p id="currentLevelName">Loading...</p>
            </div>

            <div class="twitch-config">
                <h2>Twitch Configuration</h2>
                <div class="current-channel">Current Channel: <span id="currentTwitchChannel">Loading...</span></div>
                <div class="channel-input">
                    <input type="text" id="twitchChannelInput" placeholder="Enter new channel name" />
                    <button class="btn btn-primary" onclick="updateTwitchChannel()">Save & Reconnect</button>
                </div>
            </div>
        </div>

        <div class="levels-container">
            <div class="levels-section">
                <h3>Production Levels</h3>
                <div class="levels-grid" id="prodLevelsGrid"></div>
            </div>
            <div class="levels-section">
                <h3>Development Levels</h3>
                <div class="levels-grid" id="devLevelsGrid"></div>
            </div>
            <div class="levels-section">
                <h3>Other Levels</h3>
                <div class="levels-grid" id="otherLevelsGrid"></div>
            </div>
        </div>

        <div id="statusMessage"></div>
    </div>

    <script>
        let currentLevelName = 'level1'; // Default
        let basePath = "__BASE_PATH__";

        // Load client configuration
        async function loadConfig() {
            // Fetch from absolute path - works from any route
            try {
                const response = await fetch(`${basePath}/api/client-config`);
                if (response.ok) {
                    const config = await response.json();
                    basePath = config.basePath || '';
                    console.log('Admin config loaded:', config);
                    return;
                }
            } catch (error) {
                console.error('Failed to load admin config:', error);
            }

            // If config fetch fails, use empty base path as fallback
            basePath = '';
            console.log('Using default admin config (empty base path)');
        }

        // Fetch current level from server
        async function fetchCurrentLevel() {
            try {
                const response = await fetch(`${basePath}/api/current-level`);
                if (response.ok) {
                    const data = await response.json();
                    currentLevelName = data.levelName;
                    document.getElementById('currentLevelName').textContent = data.levelName;
                } else {
                    // Fallback to level1 if no current level is set
                    currentLevelName = 'level1';
                    document.getElementById('currentLevelName').textContent = 'level1';
                }
            } catch (error) {
                console.log('Could not fetch current level:', error);
                // Fallback to level1 on error
                currentLevelName = 'level1';
                document.getElementById('currentLevelName').textContent = 'level1';
            }
        }

        // Fetch current Twitch channel
        async function fetchTwitchChannel() {
            try {
                const response = await fetch(`${basePath}/api/admin/config/twitch-channel`);
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('currentTwitchChannel').textContent = data.channel || 'Not set';
                } else {
                    document.getElementById('currentTwitchChannel').textContent = 'Error loading';
                }
            } catch (error) {
                console.log('Could not fetch Twitch channel:', error);
                document.getElementById('currentTwitchChannel').textContent = 'Error loading';
            }
        }

        // Update Twitch channel
        async function updateTwitchChannel() {
            const input = document.getElementById('twitchChannelInput');
            const newChannel = input.value.trim();

            if (!newChannel) {
                showStatus('Please enter a channel name', 'error');
                return;
            }

            if (!confirm(`Are you sure you want to change the Twitch channel to "${newChannel.toLowerCase()}"? The bot will disconnect and reconnect.`)) {
                return;
            }

            try {
                const response = await fetch(`${basePath}/api/admin/config/twitch-channel`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ channel: newChannel })
                });

                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('currentTwitchChannel').textContent = data.channel;
                    input.value = '';
                    showStatus(`Twitch channel updated to "${data.channel}" and bot reconnected`, 'success');
                } else {
                    const error = await response.json();
                    showStatus(error.error || 'Failed to update channel', 'error');
                }
            } catch (error) {
                console.error('Failed to update Twitch channel:', error);
                showStatus('Failed to update channel', 'error');
            }
        }

        // Image cache for level previews
        const previewImageCache = new Map();

        // Render a level preview on a canvas
        function renderLevelPreview(canvas, objects, backgroundImage) {
            const ctx = canvas.getContext('2d');
            const canvasWidth = canvas.width;
            const canvasHeight = canvas.height;

            // Clear canvas
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);

            // Draw background image if available
            if (backgroundImage && backgroundImage.trim()) {
                // Try to get the image from cache or load it
                if (!previewImageCache.has(backgroundImage)) {
                    // Create and cache the image
                    const img = new Image();
                    img.onload = () => {
                        previewImageCache.set(backgroundImage, img);
                        // Re-render the preview when image loads
                        renderLevelPreview(canvas, objects, backgroundImage);
                    };
                    img.onerror = () => {
                        previewImageCache.set(backgroundImage, null);
                    };
                    img.src = backgroundImage;
                    previewImageCache.set(backgroundImage, 'loading');
                }

                const cachedImage = previewImageCache.get(backgroundImage);
                if (cachedImage instanceof HTMLImageElement) {
                    // Draw the background image stretched to fill canvas
                    ctx.drawImage(cachedImage, 0, 0, canvasWidth, canvasHeight);
                }
            }

            // If no background image, draw default background
            if (!backgroundImage || !backgroundImage.trim() || !(previewImageCache.get(backgroundImage) instanceof HTMLImageElement)) {
                // Draw background
                ctx.fillStyle = 'rgba(26, 26, 46, 0.8)'; // Dark background like the game
                ctx.fillRect(0, 0, canvasWidth, canvasHeight);
            }

            if (!objects || objects.length === 0) {
                // Draw empty level indicator
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('Empty Level', canvasWidth / 2, canvasHeight / 2);
                return;
            }

            // Calculate level bounds
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;

            objects.forEach(obj => {
                if (obj.shape === 'rectangle') {
                    minX = Math.min(minX, obj.x - obj.width/2);
                    minY = Math.min(minY, obj.y - obj.height/2);
                    maxX = Math.max(maxX, obj.x + obj.width/2);
                    maxY = Math.max(maxY, obj.y + obj.height/2);
                } else if (obj.shape === 'circle') {
                    minX = Math.min(minX, obj.x - obj.radius);
                    minY = Math.min(minY, obj.y - obj.radius);
                    maxX = Math.max(maxX, obj.x + obj.radius);
                    maxY = Math.max(maxY, obj.y + obj.radius);
                }
            });

            // Add some padding
            const padding = 50;
            minX -= padding;
            minY -= padding;
            maxX += padding;
            maxY += padding;

            const levelWidth = maxX - minX;
            const levelHeight = maxY - minY;

            // Calculate scale to fit in canvas while maintaining aspect ratio
            const scaleX = canvasWidth / levelWidth;
            const scaleY = canvasHeight / levelHeight;
            const scale = Math.min(scaleX, scaleY);

            // Center the level in the canvas
            const offsetX = (canvasWidth - levelWidth * scale) / 2;
            const offsetY = (canvasHeight - levelHeight * scale) / 2;

            // Draw objects
            objects.forEach(obj => {
                ctx.save();

                // Apply rotation if present
                if (obj.rotation && obj.rotation !== 0) {
                    const centerX = (obj.x - minX) * scale + offsetX;
                    const centerY = (obj.y - minY) * scale + offsetY;
                    ctx.translate(centerX, centerY);
                    ctx.rotate(obj.rotation);
                    ctx.translate(-centerX, -centerY);
                }

                // Check if object has a background image
                if (obj.backgroundImage && obj.backgroundImage.trim()) {
                    // Try to get the image from cache or load it
                    if (!previewImageCache.has(obj.backgroundImage)) {
                        // Create and cache the image
                        const img = new Image();
                        //img.crossOrigin = 'anonymous';    // Uncomment if images are from different origin and CORS is enabled
                        img.onload = () => {
                            previewImageCache.set(obj.backgroundImage, img);
                            // Re-render the preview when image loads
                            renderLevelPreview(canvas, objects);
                        };
                        img.onerror = () => {
                            previewImageCache.set(obj.backgroundImage, null);
                        };
                        img.src = obj.backgroundImage;
                        previewImageCache.set(obj.backgroundImage, 'loading');
                    }

                    const cachedImage = previewImageCache.get(obj.backgroundImage);
                    if (cachedImage instanceof HTMLImageElement) {
                        // Draw the background image
                        if (obj.shape === 'rectangle') {
                            const x = (obj.x - obj.width/2 - minX) * scale + offsetX;
                            const y = (obj.y - obj.height/2 - minY) * scale + offsetY;
                            const width = obj.width * scale;
                            const height = obj.height * scale;

                            ctx.drawImage(cachedImage, x, y, width, height);
                        } else if (obj.shape === 'circle') {
                            // For circles, clip the image to a circle shape
                            const x = (obj.x - minX) * scale + offsetX;
                            const y = (obj.y - minY) * scale + offsetY;
                            const radius = obj.radius * scale;

                            ctx.save();
                            ctx.beginPath();
                            ctx.arc(x, y, radius, 0, Math.PI * 2);
                            ctx.clip();
                            ctx.drawImage(cachedImage, x - radius, y - radius, radius * 2, radius * 2);
                            ctx.restore();
                        }
                    } else {
                        // Image is still loading or failed to load, use color as fallback
                        ctx.fillStyle = obj.color || '#888888';

                        if (obj.shape === 'rectangle') {
                            const x = (obj.x - obj.width/2 - minX) * scale + offsetX;
                            const y = (obj.y - obj.height/2 - minY) * scale + offsetY;
                            const width = obj.width * scale;
                            const height = obj.height * scale;

                            ctx.fillRect(x, y, width, height);
                        } else if (obj.shape === 'circle') {
                            const x = (obj.x - minX) * scale + offsetX;
                            const y = (obj.y - minY) * scale + offsetY;
                            const radius = obj.radius * scale;

                            ctx.beginPath();
                            ctx.arc(x, y, radius, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }
                } else {
                    // No background image, just use color
                    ctx.fillStyle = obj.color || '#888888';

                    if (obj.shape === 'rectangle') {
                        const x = (obj.x - obj.width/2 - minX) * scale + offsetX;
                        const y = (obj.y - obj.height/2 - minY) * scale + offsetY;
                        const width = obj.width * scale;
                        const height = obj.height * scale;

                        ctx.fillRect(x, y, width, height);
                    } else if (obj.shape === 'circle') {
                        const x = (obj.x - minX) * scale + offsetX;
                        const y = (obj.y - minY) * scale + offsetY;
                        const radius = obj.radius * scale;

                        ctx.beginPath();
                        ctx.arc(x, y, radius, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                ctx.restore();
            });
        }

        // Fetch and display levels
        async function fetchLevels() {
            try {
                const response = await fetch(`${basePath}/api/admin/levels`);
                const levels = await response.json();

                // Clear all grids
                const prodGrid = document.getElementById('prodLevelsGrid');
                const devGrid = document.getElementById('devLevelsGrid');
                const otherGrid = document.getElementById('otherLevelsGrid');
                prodGrid.innerHTML = '';
                devGrid.innerHTML = '';
                otherGrid.innerHTML = '';

                if (levels.length === 0) {
                    otherGrid.innerHTML = '<p>No levels found. Create some levels in the editor!</p>';
                    return;
                }

                // Categorize levels
                const categorizedLevels = {
                    prod: [],
                    dev: [],
                    other: []
                };

                levels.forEach(level => {
                    const desc = (level.description || '').toLowerCase();
                    if (desc.includes('prod')) {
                        categorizedLevels.prod.push(level);
                    } else if (desc.includes('dev')) {
                        categorizedLevels.dev.push(level);
                    } else {
                        categorizedLevels.other.push(level);
                    }
                });

                // Render levels in each category
                Object.keys(categorizedLevels).forEach(category => {
                    const grid = category === 'prod' ? prodGrid : category === 'dev' ? devGrid : otherGrid;
                    const levelsInCategory = categorizedLevels[category];

                    if (levelsInCategory.length === 0) {
                        grid.innerHTML = '<p class="empty-state">No levels in this category</p>';
                    } else {
                        levelsInCategory.forEach(level => {
                            const levelCard = document.createElement('div');
                            levelCard.className = 'level-card';

                            const isCurrent = level.name === currentLevelName;

                            levelCard.innerHTML = `
                                <div class="level-preview">
                                    <canvas class="preview-canvas" width="200" height="150"></canvas>
                                </div>
                                <div class="level-content">
                                    <div class="level-name">${level.name} ${isCurrent ? '(Current)' : ''}</div>
                                    <div class="level-info">
                                        Description: ${level.description || 'None'}<br>
                                        Modified: ${new Date(level.modified).toLocaleString()}<br>
                                        Size: ${Math.round(level.size / 1024)} KB
                                    </div>
                                    <div class="level-actions">
                                        <button class="btn btn-primary" onclick="loadLevel('${level.name}')">
                                            ${isCurrent ? 'Reload' : 'Load'}
                                        </button>
                                        <button class="btn btn-danger" onclick="deleteLevel('${level.name}')">
                                            Delete
                                        </button>
                                    </div>
                                </div>
                            `;

                            // Render level preview
                            const canvas = levelCard.querySelector('.preview-canvas');
                            renderLevelPreview(canvas, level.objects, level.backgroundImage);

                            grid.appendChild(levelCard);
                        });
                    }
                });
            } catch (error) {
                console.error('Failed to fetch levels:', error);
                showStatus('Failed to load levels', 'error');
            }
        }

        // Load Socket.IO script dynamically
        async function loadSocketIOScript() {
            return new Promise((resolve, reject) => {
                if (window.io) {
                    resolve();
                    return;
                }
                const script = document.createElement('script');
                script.src = `${basePath}/socket.io/socket.io.js`;
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }

        // Load a level
        async function loadLevel(levelName) {
            try {
                // Ensure Socket.IO is loaded
                await loadSocketIOScript();

                // Create temporary socket connection for level loading
                const socket = io({
                    path: `${basePath}/socket.io`,
                    timeout: 5000, // Fail after 5 seconds
                    reconnection: false // Don't reconnect on disconnect
                });

                // Send level load command via WebSocket
                socket.emit('loadLevel', levelName);

                // Clean up immediately after loading
                setTimeout(() => {
                    socket.disconnect();
                }, 100); // Wait 100ms for the emit to complete, then disconnect

                currentLevelName = levelName;
                document.getElementById('currentLevelName').textContent = levelName;
                showStatus(`Level "${levelName}" loaded successfully`, 'success');
                fetchLevels(); // Refresh the list
            } catch (error) {
                console.error('Failed to load level:', error);
                showStatus('Failed to load level', 'error');
            }
        }

        // Delete a level
        async function deleteLevel(levelName) {
            if (!confirm(`Are you sure you want to delete "${levelName}"?`)) {
                return;
            }

            try {
                const response = await fetch(`${basePath}/api/admin/levels/${levelName}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    showStatus(`Level "${levelName}" deleted successfully`, 'success');
                    fetchLevels(); // Refresh the list
                } else {
                    showStatus('Failed to delete level', 'error');
                }
            } catch (error) {
                console.error('Failed to delete level:', error);
                showStatus('Failed to delete level', 'error');
            }
        }

        // Show status message
        function showStatus(message, type) {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.innerHTML = `<div class="status-message status-${type}">${message}</div>`;

            // Clear message after 5 seconds
            setTimeout(() => {
                statusDiv.innerHTML = '';
            }, 5000);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            await loadConfig();
            fetchCurrentLevel();
            fetchTwitchChannel();
            fetchLevels();
        });
    </script>
</body>
</html>
